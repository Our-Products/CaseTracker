name: CD Deployment

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Web Server
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CaseTracker.slnx

      - name: Build application (Release)
        run: dotnet build CaseTracker.slnx --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish CaseTracker/CaseTracker.csproj --configuration Release --no-build --output ./publish

      - name: Deploy with MSDeploy
        shell: pwsh
        env:
          # Supports both naming styles from GitHub Secrets
          SECRET_SERVER: ${{ secrets.SERVER_COMPUTER_NAME || secrets.WEBDEPLOY_SERVER }}
          SECRET_SITE: ${{ secrets.WEBSITE_NAME || secrets.WEBDEPLOY_SITE }}
          SECRET_USERNAME: ${{ secrets.SERVER_USERNAME || secrets.WEBDEPLOY_USERNAME }}
          SECRET_PASSWORD: ${{ secrets.SERVER_PASSWORD || secrets.WEBDEPLOY_PASSWORD }}
        run: |
          # 1. Load from .env file if present in workspace
          if (Test-Path ".env") {
              Write-Host "Found .env file. Loading environment variables..."
              Get-Content ".env" | ForEach-Object {
                  $line = $_.Trim()
                  if ($line -and -not $line.StartsWith("#") -and $line -match "^([^=]+)=(.*)$") {
                      $key = $matches[1].Trim()
                      $val = $matches[2].Trim().Trim('"').Trim("'")
                      if (-not [string]::IsNullOrWhiteSpace($val)) {
                          [System.Environment]::SetEnvironmentVariable($key, $val, "Process")
                      }
                  }
              }
          }

          # 2. Resolve credentials from GitHub Secrets first, fallback to .env
          $server = if (-not [string]::IsNullOrWhiteSpace($env:SECRET_SERVER)) { 
              $env:SECRET_SERVER 
          } else { 
              (Get-Item env:SERVER_COMPUTER_NAME, env:WEBDEPLOY_SERVER -ErrorAction SilentlyContinue | Select-Object -First 1).Value 
          }

          $site = if (-not [string]::IsNullOrWhiteSpace($env:SECRET_SITE)) { 
              $env:SECRET_SITE 
          } else { 
              (Get-Item env:WEBSITE_NAME, env:WEBDEPLOY_SITE -ErrorAction SilentlyContinue | Select-Object -First 1).Value 
          }

          $username = if (-not [string]::IsNullOrWhiteSpace($env:SECRET_USERNAME)) { 
              $env:SECRET_USERNAME 
          } else { 
              (Get-Item env:SERVER_USERNAME, env:WEBDEPLOY_USERNAME -ErrorAction SilentlyContinue | Select-Object -First 1).Value 
          }

          $password = if (-not [string]::IsNullOrWhiteSpace($env:SECRET_PASSWORD)) { 
              $env:SECRET_PASSWORD 
          } else { 
              (Get-Item env:SERVER_PASSWORD, env:WEBDEPLOY_PASSWORD -ErrorAction SilentlyContinue | Select-Object -First 1).Value 
          }

          # 3. Validate credentials
          if ([string]::IsNullOrWhiteSpace($server) -or
              [string]::IsNullOrWhiteSpace($site) -or
              [string]::IsNullOrWhiteSpace($username) -or
              [string]::IsNullOrWhiteSpace($password)) {
              Write-Error "Deployment credentials missing! Please configure WEBSITE_NAME, SERVER_COMPUTER_NAME, SERVER_USERNAME, and SERVER_PASSWORD in GitHub Repository Secrets OR define them in a .env file."
              exit 1
          }

          # 4. Locate msdeploy.exe on the Windows runner
          $msdeployPath = "C:\Program Files\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          if (-not (Test-Path $msdeployPath)) {
              $msdeployPath = "C:\Program Files (x86)\IIS\Microsoft Web Deploy V3\msdeploy.exe"
          }
          if (-not (Test-Path $msdeployPath)) {
              Write-Error "MSDeploy.exe not found on the runner."
              exit 1
          }

          # 5. Normalize server hostname and configure remote service endpoint
          $rawServer = $server.Trim()
          $site = $site.Trim()
          $username = $username.Trim()

          if ($rawServer -match '^https?://.*/msdeploy\.axd') {
              $destComputer = $rawServer
          } else {
              $cleanHost = $rawServer -replace '^https?://', '' -replace ':8172.*$', '' -replace '/.*$', ''
              $destComputer = "https://${cleanHost}:8172/msdeploy.axd?site=${site}"
          }

          $publishPath = (Resolve-Path "./publish").Path

          Write-Host "Initiating Web Deploy to $destComputer (Site: $site)..."

          # 6. Build arguments array to prevent PowerShell quote escaping issues
          $destArg = "contentPath=${site},computerName=${destComputer},userName=${username},password=${password},authtype=Basic,includeAcls=False"

          $msdeployArgs = @(
              "-verb:sync",
              "-source:contentPath=$publishPath",
              "-dest:$destArg",
              "-enableRule:AppOffline",
              "-allowUntrusted",
              "-disableLink:AppPoolExtension",
              "-disableLink:ContentExtension",
              "-disableLink:CertificateExtension",
              "-retryAttempts:5",
              "-retryInterval:3000"
          )

          & $msdeployPath $msdeployArgs

          if ($LASTEXITCODE -ne 0) {
              Write-Error "MSDeploy execution failed with exit code $LASTEXITCODE. If you received 401 Unauthorized, make sure WebDeploy is activated under the 'Visual Studio access' tab in your MonsterASP Control Panel."
              exit $LASTEXITCODE
          }

          Write-Host "Deployment completed successfully!"
