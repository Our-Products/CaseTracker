name: CI Build

on:
  pull_request:
    branches:
      - master

jobs:
  build:
    name: Build & Validate
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore CaseTracker.slnx

      - name: Build application (Release)
        run: dotnet build CaseTracker.slnx --configuration Release --no-restore
